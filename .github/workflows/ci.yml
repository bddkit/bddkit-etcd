name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a released bddkit. Bump it
  # deliberately, as its own commit, so a failure after the bump is attributable.
  HOST_TAG: v0.6.0
  # The bddkit-exec release that starts and kills the nodes of the failover
  # example, installed from its release as a user would.
  EXEC_TAG: 0.4.0

jobs:
  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # etcd-client's build script compiles .proto files: it needs protoc and
      # the well-known types that ship with libprotobuf-dev.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      # Pinned on purpose: on a floating stable a new clippy lint reddens PRs
      # that have nothing to do with it. rustflags is emptied so only the
      # clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""

      - name: Format check
        run: cargo fmt --check

      - name: File size budget
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (etcd ${{ matrix.etcd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest patch of each supported minor. Raise them with the releases.
        etcd: [v3.5.36, v3.6.17]
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}-${{ runner.os }}
      - name: Install the host
        if: steps.host.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root "$RUNNER_TEMP/bddkit-host" bddkit

      # The cluster tests and the failover example start three real etcd
      # processes of the matrix's version, so they need the binaries and not an
      # image: `etcd`, and `etcdctl` for `move-leader`. The key names both, so a
      # cache saved with `etcd` alone is not restored.
      - name: Cache the etcd binaries
        id: etcd-bin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/etcd-bin
          key: etcd-bin-etcdctl-${{ matrix.etcd }}-${{ runner.os }}
      - name: Download etcd
        if: steps.etcd-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/etcd-bin"
          name="etcd-${{ matrix.etcd }}-linux-amd64"
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${{ matrix.etcd }}/$name.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/etcd-bin" --strip-components=1 "$name/etcd" "$name/etcdctl"

      # The failover example needs the exec plugin, installed from its release
      # into a directory of its own.
      - name: Install the exec plugin
        run: |
          dir="$RUNNER_TEMP/exec-plugin"
          mkdir -p "$dir"
          "$RUNNER_TEMP/bddkit-host/bin/bddkit" plugin install "bddkit/bddkit-exec@$EXEC_TAG" --bddkit-dir "$dir"
          echo "BDDKIT_EXEC_PLUGIN=$dir/plugins/bddkit-exec/$EXEC_TAG/libbddkit_exec.so" >> "$GITHUB_ENV"

      # --wait returns once the healthcheck passes.
      - name: Start etcd
        env:
          ETCD_VERSION: ${{ matrix.etcd }}
        run: docker compose up --wait etcd etcd-b etcd-secure etcd-mtls etcd-auth

      - name: Tests
        run: |
          export BDDKIT_BIN="$RUNNER_TEMP/bddkit-host/bin/bddkit"
          # The server is the job's own: a test may clear all of it.
          export BDDKIT_TEST_ETCD_WIPE=1
          export BDDKIT_TEST_ETCD_BIN="$RUNNER_TEMP/etcd-bin/etcd"
          cargo test --locked

      # A failover is a race against elections: once green proves little, so the
      # example runs ten times in a row, and one red run fails the job.
      - name: Failover example, ten runs in a row
        run: |
          export PATH="$RUNNER_TEMP/etcd-bin:$PATH"
          cargo build --locked
          dir="$RUNNER_TEMP/failover-lock"
          mkdir -p "$dir"
          printf 'plugin:\n  - name: etcd\n    path: %s\n  - name: exec\n    path: %s\n' \
            "$PWD/target/debug/libbddkit_etcd.so" "$BDDKIT_EXEC_PLUGIN" > "$dir/plugins.yaml"
          for run in $(seq 10); do
            echo "::group::run $run of 10"
            "$RUNNER_TEMP/bddkit-host/bin/bddkit" run --config examples/cluster.yaml --bddkit-dir "$dir"
            echo "::endgroup::"
          done
